name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "chore/*", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qualidade-e-testes:
    name: Verificação de Qualidade e Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python 3.13
        run: uv python install 3.13

      - name: Sincronizar Dependências do Workspace
        run: uv sync --all-packages

      - name: Verificar Formatação de Código (Ruff Format)
        run: uv run ruff format --check .

      - name: Executar Linter e Regras Estáticas (Ruff Check)
        run: uv run ruff check .

      - name: Executar Bateria de Testes Automatizados (Pytest)
        run: uv run pytest -v
