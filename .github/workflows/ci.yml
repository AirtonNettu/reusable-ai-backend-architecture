name: CI Pipeline

on:
  push:
    branches: [ "main", "develop", "chore/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qualidade-e-testes:
    name: Verificação de Qualidade e Testes Automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python 3.13
        run: uv python install 3.13

      - name: Sincronizar Dependências do Workspace
        run: uv sync --all-packages

      - name: Verificar Formatação de Código (Ruff Format)
        run: uv run ruff format --check .

      - name: Executar Linter e Regras Estáticas (Ruff Check)
        run: uv run ruff check .

      - name: Auditoria de Vulnerabilidades em Dependências (SCA via pip-audit)
        run: uv run --with pip-audit pip-audit

      - name: Executar Bateria de Testes Automatizados (Pytest com PostgreSQL 17 Real)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/postgres_teste
          POSTGRES_OBRIGATORIO: "true"
        run: uv run pytest -v
