# SPDX-License-Identifier: Apache-2.0

[project]
name = "reusable-ai-backend-architecture"
version = "0.1.0"
description = "Plataforma corporativa reutilizável e desacoplada para aplicações de IA"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "httpx>=0.28.1",
    "asyncpg>=0.32.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/ai-core",
    "services/ai-gateway",
]
