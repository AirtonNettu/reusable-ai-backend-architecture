# SPDX-License-Identifier: Apache-2.0

[project]
name = "ai-gateway"
version = "0.1.0"
description = "HTTP gateway for reusable AI applications"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.15"
dependencies = [
    "ai-core",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
ai-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
